<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form>
        <label for="num1">Informe um número</label><br>
        <input type="text" id="num1"><br>

        <label for="num2">Informe outro número</label><br>
        <input type="text" id="num2"><br>

        <button type="submit" id="botao">Enviar</button>
        <p id="resultado"></p>
    </form>

    <script>
        let num1 = document.getElementById("num1");
        let num2 = document.getElementById("num2");
        let botao = document.getElementById("botao");
        let resultado = document.getElementById("resultado");

        botao.addEventListener("click", function (event) {
            event.preventDefault();

            let valor1 = Number(num1.value);
            let valor2 = Number(num2.value);

            if (valor1 > valor2) {
                resultado.innerText = "O número " + valor1 + " é maior";
            } else if (valor2 > valor1) {
                resultado.innerText = "O número " + valor2 + " é maior";
            } else {
                resultado.innerText = "Ambos são iguais";
            }
        });
    </script>
</body>

</html>
