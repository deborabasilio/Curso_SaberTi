<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificação de idade</title>
</head>

<body>
    <form>
        <label for="idade">Informe sua idade</label><br>
        <input type="text" id="idade"><br><br>

        <button id="botao">Enviar</button>
        <p id="resultado"></p>
    </form>

    <script>
        let idade = document.getElementById("idade");
        let botao = document.getElementById("botao");
        let resultado = document.getElementById("resultado");

        botao.addEventListener("click", function (event) {
            event.preventDefault();

           // let valorIdade = Number(idade.value);

            if (Number(idade.value) >= 18) {
                resultado.innerText = "Usuário maior de idade";
            } else {
                resultado.innerText = "Usuário menor de idade";
            }
        });
    </script>
</body>

</html>
