<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 2</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <h1>Cadastro de Cliente</h1>
    <p>Preencha os dados abaixo para cadastrar um novo cliente.</p>
    <form>
        <div>
        <label for="nome">Nome Completo:</label>
        <input type="text" id="nome" name="nome" placeholder="Digite o nome do cliente" required>
        </div>
        <div>
        <label for="cpf">CPF:</label>
        <input type="text" id="cpf" name="cpf" placeholder="Digite o CPF" required>
        </div>
        <div>
        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email" placeholder="Digite o e-mail">
        </div>
        <div>
        <label for="telefone">Telefone:</label>
        <input type="tel" id="telefone" name="telefone" placeholder="Digite o telefone">
        </div>
        <div>
        <label for="data">Data de nascimento:</label>
        <input type="date" id="data" name="data" placeholder="dd / mm / aaaa">
        </div>
        <div>
        <label for="endereco">Endereço:</label>
        <input type="text" id="endereco" name="endereco" placeholder="Digite o endereço">
        </div>
        <div>
        <label for="cidade">Cidade:</label>
        <input type="text" id="cidade" name="cidade" placeholder="Digite a cidade">
        </div>
        <div>
        <label for="estado">Estado:</label>
        <select id="estado" name="estado">
            <option value="" disabled selected>Selecione</option>
            <option value="AC">Acre</option>
            <option value="AL">Alagoas</option>
            <option value="AP">Amapá</option>
            <option value="AM">Amazonas</option>
            <option value="BA">Bahia</option>
            <option value="CE">Ceará</option>
            <option value="DF">Distrito Federal</option>
        </select>
        </div>
        <div>
        <label for="cliente">Tipo de cliente:</label>
        <select id="cliente" name="cliente">
            <option value="" disabled selected>Selecione</option>
            <option value="fisico">Físico</option>
            <option value="juridico">Jurídico</option>
        </select>
        </div>
        <div>
        <label for="obs">Observações:</label>
        <textarea id="obs" name="obs" rows="4" placeholder="Digite alguma observação"></textarea>
        </div>
        <div>
        <button type="submit" class="btn-cadastrar">Cadastrar Cliente</button>
        <button type="reset" clas="btn-limpar">Limpar</button>
        </div>
    </form>
</body>

</html>
