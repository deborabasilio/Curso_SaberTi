<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>Informe as notas bimestrais do aluno e o número de faltas</h1><br>
    <form>
        <label for="nota1">Nota 1</label><br>
        <input type="text" id="nota1" placeholder="Digite a nota 1"><br>

        <label for="nota2">Nota 2</label><br>
        <input type="text" id="nota2" placeholder="Digite a nota 2"><br>

        <label for="nota3">Nota 3</label><br>
        <input type="text" id="nota3" placeholder="Digite a nota 3"><br>

        <label for="nota4">Nota 4</label><br>
        <input type="text" id="nota4" placeholder="Digite a nota 4"><br>

        <label for="faltas">Número de faltas</label><br>
        <input type="text" id="faltas" placeholder="Digite o número de faltas"><br>

        <button type="submit" id="botao">Enviar</button><br>

        <h3 id="resultado"></h3>
    </form>

    <script>
        //busca pelo id
        let nota1 = document.getElementById("nota1");
        let nota2 = document.getElementById("nota2");
        let nota3 = document.getElementById("nota3");
        let nota4 = document.getElementById("nota4");
        let faltas = document.getElementById("faltas");
        let botao = document.getElementById("botao");
        let resultado = document.getElementById("resultado");

        const mediaMin = 60;
        const faltasMax = 20;

        botao.addEventListener("click", function (event) {
            event.preventDefault();

            //convertendo em numero
            let nota1c = Number(nota1.value);
            let nota2c = Number(nota2.value);
            let nota3c = Number(nota3.value);
            let nota4c = Number(nota4.value);
            let faltasC = Number(faltas.value);

            let media = (nota1c + nota2c + nota3c + nota4c) / 4;

            if ((media >= mediaMin) && (faltasC <= faltasMax)) {
                resultado.innerText = "O aluno foi aprovado com média de " + media + " e " + faltasC + " faltas ";
            } else {
                resultado.innerText = "O aluno foi reprovado com média de " + media + " e " + faltasC + " faltas";
            }

        });

    </script>
</body>

</html>
